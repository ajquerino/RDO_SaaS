services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: industrialos
      POSTGRES_USER: industrialos
      POSTGRES_PASSWORD: industrialos
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrialos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=industrialos;Username=industrialos;Password=industrialos"
    ports: ["8080:8080"]

volumes:
  dbdata:
