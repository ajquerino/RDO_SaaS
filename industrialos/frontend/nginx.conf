server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker e registrador NUNCA podem ser cacheados: senão o PWA não atualiza
    # e o usuário fica preso numa versão antiga do app.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    # O manifesto do PWA também deve revalidar.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome podem cachear forte (o hash muda a cada build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback da SPA: qualquer rota cai no index.html (o roteamento é no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
